<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — DSA Practice</title>
  <link rel="icon" type="image/png" href="public/logo.png" />
  <link rel="stylesheet" href="public/css/base.css" />
  <link rel="stylesheet" href="public/css/layout.css" />
  <link rel="stylesheet" href="public/css/editor.css" />
  <link rel="stylesheet" href="public/css/components.css" />
  <link rel="stylesheet" href="public/css/pages.css" />
  <link rel="stylesheet" href="public/css/responsive.css" />
</head>
<body style="overflow:auto;height:auto;min-height:100vh">
  <div id="top-loader" class="top-loader"></div>
  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="logo" style="text-decoration:none;color:var(--text);display:flex;align-items:center;gap:8px"><img src="public/logo.png" alt="Logo" style="height:32px;width:auto;border-radius:6px;object-fit:contain"> DSA Practice</a>
      <nav class="topbar-nav">
        <a href="dashboard.html" class="ghost-link active">Dashboard</a>
        <a href="index.html" class="ghost-link">Problems</a>
        <a href="problems.html" class="ghost-link">Browse</a>
        <a href="roadmap.html" class="ghost-link">Roadmap</a>
        <a href="leaderboard.html" class="ghost-link">Leaderboard</a>
      </nav>
    </div>
    <div class="topbar-right">
      <span id="auth-area" style="display:flex;gap:8px;align-items:center"></span>
    </div>
  </header>

  <div class="dash-wrap" id="dash-root">
    <div id="dash-loading" style="color:var(--muted);padding:40px;text-align:center">Loading dashboard...</div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const $ = s=>document.querySelector(s);
    const toastEl=$("#toast");
    function toast(m){ toastEl.textContent=m; toastEl.classList.remove("hidden"); setTimeout(()=>toastEl.classList.add("hidden"),2500); }
    function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function getToken(){ return localStorage.getItem("token"); }
    function getUser(){ try{ return JSON.parse(localStorage.getItem("user")||"null"); }catch{ return null; } }
    function clearAuth(){ localStorage.removeItem("token"); localStorage.removeItem("user"); }
    function authHeaders(h={}){ const t=getToken(); if(t) h["Authorization"]="Bearer "+t; return h; }
    function updateTopbar(user){
      const a=$("#auth-area");
      if(!a) return;
      if(user){
        a.innerHTML=`<a href="settings.html" style="font-weight:600;font-size:13px;color:var(--text);text-decoration:none" title="Account settings">${esc(user.username)}</a><button id="logout-btn" class="btn ghost" style="padding:6px 10px;font-size:12px">Logout</button>`;
        document.getElementById("logout-btn")?.addEventListener("click",()=>{ clearAuth(); location.href="login.html"; });
      } else {
        a.innerHTML=`<a href="login.html" class="ghost-link" style="padding:6px 10px">Login</a><a href="register.html" class="btn primary" style="padding:6px 10px">Register</a>`;
      }
    }
    function showLoader(){ const el=document.getElementById("top-loader"); if(el){ el.classList.remove("done"); el.classList.add("active"); void el.offsetWidth; el.style.width="70%"; } }
    function hideLoader(){ const el=document.getElementById("top-loader"); if(el){ el.style.width="100%"; el.classList.add("done"); setTimeout(()=>{ el.classList.remove("active","done"); el.style.width="0%"; },300); } }
    function levelClass(count){
      if(count===0) return "";
      if(count===1) return "l1";
      if(count===2) return "l2";
      if(count===3) return "l3";
      if(count>=4 && count<6) return "l4";
      return "l5";
    }
    async function fetchDashboard(userId){
      const t=getToken();
      let url;
      if(userId) url=`/api/users/${encodeURIComponent(userId)}/dashboard`;
      else url=`/api/users/me/dashboard`;
      const headers=authHeaders({});
      const res=await fetch(url,{ headers });
      if(res.status===401) throw new Error("Unauthorized — please login");
      if(!res.ok){ const d=await res.json().catch(()=>({})); throw new Error(d.error||"Failed to load dashboard"); }
      return await res.json();
    }
    async function fetchQuestionsSummaries(){
      const r=await fetch("/api/questions");
      if(!r.ok) return [];
      return await r.json();
    }
    function renderRing(solved,total){
      const pct = total? Math.round(solved/total*100):0;
      const r=60, c=2*Math.PI*r;
      const offset = c * (1 - pct/100);
      return `<div class="ring">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="12"/>
          <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="ring-center"><span class="big">${solved}/${total}</span><span class="small">${pct}% solved</span></div>
      </div>`;
    }

    function collapseListItems(items, grp, initial){
      if(items.length<=initial) return `<ul>${items.join("")}</ul>`;
      const head=items.slice(0,initial).join("");
      const tail=items.slice(initial).map(li=>li.replace("<li",`<li class="extra hidden" data-grp="${grp}"`)).join("");
      return `<ul>${head}${tail}</ul><button class="btn ghost collapse-toggle" data-target="${grp}" data-total="${items.length}" data-open="0" style="padding:4px 10px;font-size:12px;margin-top:6px">Show all ${items.length} ▾</button>`;
    }
    // delegated toggle for all collapsed dashboard lists
    document.addEventListener("click",e=>{
      const b=e.target && e.target.closest ? e.target.closest(".collapse-toggle") : null;
      if(!b) return;
      const root=document.getElementById("dash-root");
      if(!root || !root.contains(b)) return;
      const grp=b.dataset.target, open=b.dataset.open==="1";
      root.querySelectorAll(`li.extra[data-grp="${grp}"]`).forEach(li=>li.classList.toggle("hidden",open));
      b.dataset.open=open?"0":"1";
      b.textContent=open?`Show all ${b.dataset.total} ▾`:`Show less ▴`;
    });
    async function init(){
      const root=document.getElementById("dash-root");
      root.innerHTML=`<div class="loading">Loading dashboard...</div><div style="display:grid;gap:12px;margin-top:16px"><div class="skeleton card" style="height:180px"></div><div class="skeleton card" style="height:120px"></div><div class="skeleton card" style="height:200px"></div></div>`;
      showLoader();
      const params=new URLSearchParams(location.search);
      let viewId = params.get("id") || params.get("user") || params.get("userId");
      if(!viewId && location.hash && /^\d+$/.test(location.hash.slice(1))) viewId=location.hash.slice(1);
      const me = getUser();
      const token=getToken();
      if(token){
        try{ const r=await fetch("/api/me",{ headers:{ Authorization:"Bearer "+token } }); if(r.ok){ const u=await r.json(); localStorage.setItem("user",JSON.stringify(u)); updateTopbar(u);} else { clearAuth(); updateTopbar(null);} }catch{ updateTopbar(me); }
      } else updateTopbar(null);

      let isOther=false;
      let targetId=null;
      if(viewId){
        targetId=viewId;
        isOther = !me || String(me.id)!==String(viewId);
      } else {
        if(!token){ document.getElementById("dash-root").innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted)"><h2 style="color:var(--text)">Login required</h2><p>Please <a href="login.html" style="color:var(--accent)">Login</a> to view your dashboard.</p><p style="margin-top:10px">Or view <a href="leaderboard.html" style="color:var(--accent)">Leaderboard</a></p></div>`; return; }
        targetId=null; // me
      }
      // if other user but not logged in, still allow viewing if server permits anon? Our /api/users/:id/dashboard requires DB but not necessarily auth for numeric id, but we try with auth if present
      let data, questions, daily=null;
      try{
        [data, questions] = await Promise.all([fetchDashboard(targetId), fetchQuestionsSummaries()]);
        try{
          const rd=await fetch("/api/daily");
          if(rd.ok) daily=await rd.json();
        }catch{}
        hideLoader();
      }catch(e){
        hideLoader();
        document.getElementById("dash-root").innerHTML=`<div style="text-align:center;padding:40px;color:var(--muted)"><h2 style="color:var(--text)">Error</h2><p>${esc(e.message)}</p></div>`;
        return;
      }
      // If today has no generated daily yet, trigger one in the background
      // (logged-in users only) and swap the fallback card when it lands.
      // Never blocks render; failures silently keep the rotation fallback.
      if(daily && !daily.generated && getToken()){
        fetch("/api/daily/ensure",{method:"POST",headers:authHeaders({})}).then(async r=>{
          const d=await r.json().catch(()=>({}));
          if(!r.ok || !d.generated) return;
          try{
            const rd=await fetch("/api/daily");
            if(!rd.ok) return;
            daily=await rd.json();
            const wrap=document.getElementById("daily-card-wrap");
            if(wrap) wrap.innerHTML=dailyCardHtml();
          }catch{}
        }).catch(()=>{});
      }
      function dailyCardHtml(){
        if(!daily) return "";
        const done=solvedIds.has(daily.questionId);
        return `<div class="daily-card">
          <span class="daily-icon">📅</span>
          <div class="daily-body">
            <div class="daily-eyebrow">Daily challenge <span class="daily-date">· ${esc(daily.date)}</span></div>
            <div style="margin-top:3px"><a href="index.html#${esc(daily.questionId)}" class="daily-title">${esc(daily.title)}</a> <span class="badge ${esc(daily.difficulty)}">${esc(daily.difficulty)}</span></div>
            <div class="daily-sub">${done?'<span class="daily-solved">Solved ✓ — nice work</span>':(daily.generated?'<span class="daily-fresh">Fresh today ✨ — generated for you</span>':"Rotation pick · Medium/Hard")}</div>
          </div>
          <a href="index.html#${esc(daily.questionId)}" class="btn primary" style="padding:8px 16px;text-decoration:none">${done?"Review →":"Solve →"}</a>
        </div>`;
      }
      const stats=data.stats;
      const solvedIds=new Set(data.solvedIds||[]);
      window.__DASHBOARD_READONLY = isOther;
      const userLabel = isOther ? `User #${esc(targetId)}` : (me? esc(me.username):"You");
      // other-user view keeps a small read-only identity line (editing lives in Settings)
      let otherHead = "";
      if(isOther){
        try{
          const rp=await fetch(`/api/users/${encodeURIComponent(targetId)}/profile`,{headers:token?{Authorization:"Bearer "+token}:{}});
          if(rp.ok){
            const pp=await rp.json();
            otherHead=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;color:var(--muted);font-size:13px">`
              + (pp.avatar?`<img src="${esc(pp.avatar)}" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--border)" onerror="this.style.display='none'">`:"")
              + `<span><strong style="color:var(--text)">${esc(pp.username)}</strong>${pp.bio?` · ${esc(pp.bio)}`:""}</span></div>`;
          }
        }catch{}
      }
      const unsolved = questions.filter(q=>!solvedIds.has(q.id));

      const diff = stats.byDifficulty || { Easy:{solved:0,total:0}, Medium:{solved:0,total:0}, Hard:{solved:0,total:0} };
      function diffPct(d){ const t=d.total||0, s=d.solved||0; return t? Math.round(s/t*100):0; }

      const streaks = stats.streaks || { current:0, longest:0, totalActive:0, calendar:[] };

      const recent = stats.recent || [];

      const cal = streaks.calendar || [];
      // group calendar by month for separate sections
      function groupByMonth(calendar){
        const groups = {};
        for(const cell of calendar){
          const month = cell.date.slice(0,7); // YYYY-MM
          if(!groups[month]) groups[month]=[];
          groups[month].push(cell);
        }
        return Object.entries(groups).sort((a,b)=> a[0].localeCompare(b[0]));
      }
      const calByMonth = groupByMonth(cal);
      const monthName = (ym)=> { const [y,m]=ym.split('-'); const d=new Date(parseInt(y),parseInt(m)-1,1); return d.toLocaleString('en-US',{month:'short',year:'numeric'}); };
      const calHtml = calByMonth.map(([ym, cells])=> `
        <div class="month-block">
          <div class="month-label">${monthName(ym)} <span style="color:var(--muted);font-weight:400">(${cells.filter(c=>c.count>0).length} active)</span></div>
          <div class="cal-grid small">${cells.map(cell=> `<div class="cal-cell ${levelClass(cell.count)}" title="${cell.date}: ${cell.count} solve${cell.count!==1?'s':''}"></div>`).join("")}</div>
        </div>
      `).join("");

      const recentItems = recent.map(r=>`<li><a href="index.html#${esc(r.questionId)}" class="q-link">${esc(r.title)}</a><span style="display:flex;gap:6px;align-items:center"><span class="badge ${esc(r.difficulty)}">${esc(r.difficulty)}</span><span style="color:var(--muted);font-size:11px">${new Date(r.solvedAt).toLocaleDateString()}</span></span></li>`);
      const recentHtml = recent.length? collapseListItems(recentItems,"recent",8) : `<div style="color:var(--muted);font-size:13px">No solves yet — start solving!</div>`;

      const unsolvedItems = unsolved.map(q=>`<li><a href="index.html#${esc(q.id)}" class="q-link">${esc(q.title)}</a><span class="badge ${esc(q.difficulty)}">${esc(q.difficulty)}</span></li>`);
      const unsolvedHtml = unsolved.length? collapseListItems(unsolvedItems,"unsolved",12) : `<div style="color:var(--muted);font-size:13px">All caught up! 🎉</div>`;

      const added = questions.filter(q=> String(q.addedBy)===String(me?.id) || (q.addedByUsername && me && q.addedByUsername===me.username));
      const addedItems = added.map(q=>`<li><a href="index.html#${esc(q.id)}" class="q-link">${esc(q.title)}</a><span class="badge ${esc(q.difficulty)}">${esc(q.difficulty)}</span></li>`);
      const addedHtml = added.length? collapseListItems(addedItems,"added",8) : `<div style="color:var(--muted);font-size:13px">No questions added yet. <a href="add-question.html" style="color:var(--accent)">Add one</a></div>`;

      document.getElementById("dash-root").innerHTML=`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
          <h1 style="font-size:22px">${isOther? `Dashboard — ${userLabel}` : `Dashboard`}${isOther? ' <span style="color:var(--muted);font-size:13px;font-weight:400">(read-only)</span>':''}</h1>
          <span style="color:var(--muted);font-size:13px">${stats.solved} solved · ${stats.total} total</span>
        </div>
        ${daily?`<div id="daily-card-wrap">${dailyCardHtml()}</div>`:""}
        ${otherHead}
        <div class="dash-grid">
          <div class="ring-card">
            ${renderRing(stats.solved, stats.total)}
            <div class="diff-breakdown">
              ${["Easy","Medium","Hard"].map(k=>{
                const d=diff[k]||{solved:0,total:0};
                const pct=diffPct(d);
                const cls=k.toLowerCase();
                return `<div class="diff-row"><span style="min-width:60px">${k}</span><div class="diff-bar ${cls}"><span style="width:${pct}%"></span></div><span style="min-width:60px;text-align:right">${d.solved}/${d.total}</span></div>`;
              }).join("")}
            </div>
          </div>
          <div>
            <div class="streak-grid">
              <div class="streak-card"><div class="num">${streaks.current}</div><div class="lbl">Current streak</div></div>
              <div class="streak-card"><div class="num">${streaks.longest}</div><div class="lbl">Longest streak</div></div>
              <div class="streak-card"><div class="num">${streaks.totalActive}</div><div class="lbl">Active days</div></div>
            </div>
            <div class="heatmap">
              <h3>Activity — last 12 months</h3>
              <div class="months-grid">${calHtml}</div>
              <div style="display:flex;gap:6px;align-items:center;margin-top:10px;font-size:11px;color:var(--muted)">Less <span style="display:flex;gap:3px">${[0,1,2,3,5].map(c=>`<span class="cal-cell ${levelClass(c)}" style="width:12px;height:12px"></span>`).join("")}</span> More</div>
            </div>
          </div>
        </div>
        <div class="dash-lists">
          <div class="list-card"><h3>Recently solved</h3>${recentHtml}</div>
          <div class="list-card"><h3>Unsolved</h3>${unsolvedHtml}</div>
        </div>
        <div class="list-card" style="margin-top:16px"><h3>Added Questions <span style="color:var(--muted);font-weight:400">(${added.length})</span></h3>${addedHtml}</div>
        ${isOther? `<div style="margin-top:16px;padding:12px;background:#15181f;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px">Read-only view — code history hidden for privacy.</div>` : `<div style="margin-top:16px;padding:12px;background:#15181f;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px">Your submissions are private and scoped per user. Code autosaves every 10s to DB with your token.</div>`}
      `;
      }
    init();
  </script>
</body>
</html>
