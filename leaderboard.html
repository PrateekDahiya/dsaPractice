<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — DSA Practice</title>
  <link rel="icon" type="image/png" href="public/logo.png" />
  <link rel="stylesheet" href="public/css/base.css" />
  <link rel="stylesheet" href="public/css/layout.css" />
  <link rel="stylesheet" href="public/css/editor.css" />
  <link rel="stylesheet" href="public/css/components.css" />
  <link rel="stylesheet" href="public/css/pages.css" />
  <link rel="stylesheet" href="public/css/responsive.css" />
</head>
<body style="overflow:auto;height:auto;min-height:100vh">
  <div id="top-loader" class="top-loader"></div>
  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="logo" style="text-decoration:none;color:var(--text);display:flex;align-items:center;gap:8px"><img src="public/logo.png" alt="Logo" style="height:32px;width:auto;border-radius:6px;object-fit:contain"> DSA Practice</a>
      <nav class="topbar-nav">
        <a href="dashboard.html" class="ghost-link">Dashboard</a>
        <a href="problems.html" class="ghost-link">Browse</a>
        <a href="roadmap.html" class="ghost-link">Roadmap</a>
        <a href="leaderboard.html" class="ghost-link active">Leaderboard</a>
      </nav>
    </div>
    <div class="topbar-right">
      <a href="index.html" class="ghost-link">Problems</a>
      <span id="auth-area" style="display:flex;gap:8px;align-items:center"></span>
    </div>
  </header>

  <div class="lb-wrap">
    <h1 style="font-size:22px;margin-bottom:6px">Leaderboard</h1>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px">Rank by solved problems · Filter by time window</p>
    <div class="filter-tabs" id="filter-tabs">
      <button data-filter="all" class="active">All time</button>
      <button data-filter="weekly">Weekly</button>
      <button data-filter="monthly">Monthly</button>
      <button id="lb-refresh" title="Refetch from server" style="margin-left:auto">⟳ Refresh</button>
    </div>
    <div id="lb-updated" style="color:var(--muted);font-size:11px;margin:-8px 0 10px"></div>
    <div id="lb-loading" style="color:var(--muted);padding:20px;text-align:center">Loading...</div>
    <table class="lb-table hidden" id="lb-table">
      <thead>
        <tr>
          <th style="width:70px">Rank</th>
          <th>User</th>
          <th style="width:90px">Solved</th>
          <th style="width:100px">Streak</th>
          <th style="width:140px">Last solve</th>
        </tr>
      </thead>
      <tbody id="lb-body"></tbody>
    </table>
    <div id="lb-empty" class="hidden" style="color:var(--muted);padding:20px;text-align:center">No users yet.</div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const $=s=>document.querySelector(s);
    const toastEl=$("#toast");
    function toast(m){ toastEl.textContent=m; toastEl.classList.remove("hidden"); setTimeout(()=>toastEl.classList.add("hidden"),2500); }
    function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function getToken(){ return localStorage.getItem("token"); }
    function getUser(){ try{ return JSON.parse(localStorage.getItem("user")||"null"); }catch{ return null; } }
    function clearAuth(){ localStorage.removeItem("token"); localStorage.removeItem("user"); }
    function authHeaders(h={}){ const t=getToken(); if(t) h["Authorization"]="Bearer "+t; return h; }
    function updateTopbar(){
      const user=getUser();
      const a=$("#auth-area");
      if(!a) return;
      if(user && getToken()){
        a.innerHTML=`<a href="dashboard.html" style="font-weight:600;font-size:13px;color:var(--text);text-decoration:none">${esc(user.username)}</a><button id="logout-btn" class="btn ghost" style="padding:6px 10px;font-size:12px">Logout</button>`;
        document.getElementById("logout-btn")?.addEventListener("click",()=>{ clearAuth(); location.reload(); });
      } else {
        a.innerHTML=`<a href="login.html" class="ghost-link" style="padding:6px 10px">Login</a><a href="register.html" class="btn primary" style="padding:6px 10px">Register</a>`;
      }
    }
    function showLoader(){ const el=document.getElementById("top-loader"); if(el){ el.classList.remove("done"); el.classList.add("active"); void el.offsetWidth; el.style.width="70%"; } }
    function hideLoader(){ const el=document.getElementById("top-loader"); if(el){ el.style.width="100%"; el.classList.add("done"); setTimeout(()=>{ el.classList.remove("active","done"); el.style.width="0%"; },300); } }
    let currentFilter="all";
    // Client cache: each filter is fetched ONCE per page load; switching tabs
    // renders instantly from memory. Only Refresh (or page reload) refetches.
    const lbCache={};
    const lbUpdatedAt={};
    function fmtUpdated(ts){
      if(!ts) return "";
      const s=Math.max(0,Math.round((Date.now()-ts)/1000));
      if(s<5) return "updated just now";
      if(s<60) return `updated ${s}s ago`;
      const m=Math.floor(s/60);
      return m<60?`updated ${m}m ago`:`updated ${Math.floor(m/60)}h ago`;
    }
    function paintUpdated(){
      const el=$("#lb-updated");
      if(el) el.textContent=fmtUpdated(lbUpdatedAt[currentFilter]);
    }
    async function fetchLeaderboard(filter){
      const headers=authHeaders({});
      // streak=1: server attaches each row's current streak in the same
      // roundtrip (one batched query) — no per-user stats fan-out.
      const res=await fetch(`/api/leaderboard?filter=${encodeURIComponent(filter)}&limit=50&streak=1`, { headers });
      if(!res.ok){ const d=await res.json().catch(()=>({})); throw new Error(d.error||"Failed to load leaderboard"); }
      return await res.json();
    }
    function formatLast(d){
      if(!d) return "-";
      const dt=new Date(d);
      const now=new Date();
      const diffMs=now-dt;
      const diffDays=Math.floor(diffMs/86400000);
      if(diffDays===0) return "today " + dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      if(diffDays===1) return "yesterday";
      if(diffDays<7) return diffDays+"d ago";
      return dt.toLocaleDateString();
    }
    async function render(filter, opts={}){
      currentFilter=filter;
      document.querySelectorAll("#filter-tabs button[data-filter]").forEach(b=> b.classList.toggle("active", b.dataset.filter===filter));
      const loading=$("#lb-loading"); const table=$("#lb-table"); const body=$("#lb-body"); const empty=$("#lb-empty");
      // Cached filter => instant render, zero API calls.
      if(!opts.refresh && lbCache[filter]){
        paintTable(lbCache[filter], table, body, empty, loading);
        paintUpdated();
        return;
      }
      loading.innerHTML=`<div class="loading">Loading leaderboard...</div>`; loading.classList.remove("hidden"); table.classList.add("hidden"); empty.classList.add("hidden");
      showLoader();
      try{
        const rows=await fetchLeaderboard(filter);
        lbCache[filter]=rows;
        lbUpdatedAt[filter]=Date.now();
        hideLoader();
        paintTable(rows, table, body, empty, loading);
        paintUpdated();
      }catch(e){
        hideLoader();
        loading.textContent="Error: "+e.message;
        loading.classList.remove("hidden");
      }
    }
    function paintTable(rows, table, body, empty, loading){
      loading.classList.add("hidden");
      if(!rows.length){ empty.classList.remove("hidden"); return; }
      table.classList.remove("hidden");
      body.innerHTML=rows.map((u,i)=>{
        const rank=i+1;
        // use rank badge with gold for top 3
        return `<tr>
          <td><span class="rank-badge ${rank<=3?'gold':''}">${rank}</span></td>
          <td class="lb-user"><a href="dashboard.html?id=${u.id}">${esc(u.username)}</a></td>
          <td>${u.solvedCount}</td>
          <td>${esc(String(u.streak ?? "-"))}</td>
          <td style="color:var(--muted);font-size:12px">${esc(formatLast(u.lastSolvedAt))}</td>
        </tr>`;
      }).join("");
    }
    document.querySelectorAll('#filter-tabs button[data-filter]').forEach(btn=>{
      btn.addEventListener("click",()=> render(btn.dataset.filter));
    });
    document.getElementById("lb-refresh")?.addEventListener("click",()=> render(currentFilter, { refresh: true }));
    (async()=>{
      updateTopbar();
      // verify token
      const t=getToken();
      if(t){
        try{ const r=await fetch("/api/me",{ headers:{ Authorization:"Bearer "+t }}); if(!r.ok) clearAuth(); else { const u=await r.json(); localStorage.setItem("user",JSON.stringify(u)); updateTopbar(); } }catch{}
      }
      render("all");
    })();
  </script>
</body>
</html>
