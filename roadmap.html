<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap — DSA Practice</title>
  <link rel="icon" type="image/png" href="public/logo.png" />
  <link rel="stylesheet" href="public/css/base.css" />
  <link rel="stylesheet" href="public/css/layout.css" />
  <link rel="stylesheet" href="public/css/editor.css" />
  <link rel="stylesheet" href="public/css/components.css" />
  <link rel="stylesheet" href="public/css/pages.css" />
  <link rel="stylesheet" href="public/css/responsive.css" />
</head>
<body style="overflow:auto;height:auto;min-height:100vh">
  <div id="top-loader" class="top-loader"></div>
  <header class="topbar">
    <div class="topbar-left">
      <a href="dashboard.html" class="logo" style="text-decoration:none;color:var(--text);display:flex;align-items:center;gap:8px"><img src="public/logo.png" alt="Logo" style="height:32px;width:auto;border-radius:6px;object-fit:contain"> DSA Practice</a>
      <nav class="topbar-nav">
        <a href="dashboard.html" class="ghost-link">Dashboard</a>
        <a href="index.html" class="ghost-link">Problems</a>
        <a href="problems.html" class="ghost-link">Browse</a>
        <a href="roadmap.html" class="ghost-link active">Roadmap</a>
        <a href="leaderboard.html" class="ghost-link">Leaderboard</a>
      </nav>
    </div>
    <div class="topbar-right">
      <span id="auth-area" style="display:flex;gap:8px;align-items:center"></span>
    </div>
  </header>

  <div class="lb-wrap" style="max-width:1100px">
    <h1 style="font-size:22px;margin-bottom:6px">Striver A2Z Roadmap</h1>
    <p style="color:var(--muted);font-size:13px;margin-bottom:6px">20 steps, basics to advanced — your questions slotted in, gaps fillable with AI.</p>
    <div id="overall" style="margin-bottom:16px;font-size:13px">Loading...</div>
    <div id="ai-note" class="hidden" style="background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--muted)"></div>
    <div id="steps"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const $=s=>document.querySelector(s);
    const toastEl=$("#toast");
    function toast(m){ toastEl.textContent=m; toastEl.classList.remove("hidden"); setTimeout(()=>toastEl.classList.add("hidden"),3500); }
    function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function getToken(){ return localStorage.getItem("token"); }
    function getUser(){ try{ return JSON.parse(localStorage.getItem("user")||"null"); }catch{ return null; } }
    function clearAuth(){ localStorage.removeItem("token"); localStorage.removeItem("user"); }
    function authHeaders(h={}){ const t=getToken(); if(t) h["Authorization"]="Bearer "+t; return h; }
    function updateTopbar(){
      const user=getUser();
      const a=$("#auth-area");
      if(!a) return;
      if(user && getToken()){
        a.innerHTML=`<a href="settings.html" style="font-weight:600;font-size:13px;color:var(--text);text-decoration:none" title="Account settings">${esc(user.username)}</a><button id="logout-btn" class="btn ghost" style="padding:6px 10px;font-size:12px">Logout</button>`;
        document.getElementById("logout-btn")?.addEventListener("click",()=>{ clearAuth(); location.reload(); });
      } else {
        a.innerHTML=`<a href="login.html" class="ghost-link" style="padding:6px 10px">Login</a><a href="register.html" class="btn primary" style="padding:6px 10px">Register</a>`;
      }
    }

    const STEPS=[
      {slug:"basics",title:"Basics & Maths",blurb:"Language basics, time complexity, number drills.",seedIds:["find-missing-number","single-number"],genDifficulty:"Easy",planned:["Count Digits","Reverse a Number","Palindrome Number","GCD and LCM","Armstrong Number","Print All Divisors"]},
      {slug:"sorting",title:"Sorting",blurb:"Implement the sorts yourself before using built-ins.",seedIds:["union-of-two-sorted-arrays"],genDifficulty:"Easy",planned:["Selection Sort","Bubble Sort","Insertion Sort","Merge Sort","Quick Sort"]},
      {slug:"arrays",title:"Arrays",blurb:"The workhorse topic — traversal, two pointers, prefix sums.",seedIds:["two-sum","move-zeroes","remove-duplicates-sorted-array","maximum-subarray","majority-element","best-time-to-buy-and-sell-stock","rearrange-array-by-sign","count-subarrays-with-sum-k","maximum-consecutive-ones","move-negative-numbers","rotate-array","leaders-in-array","longest-subarray-given-sum","subarray-sum-equals-k","product-of-array-except-self","longest-consecutive-sequence","maximum-product-subarray","three-sum","container-with-most-water","intersection-of-two-arrays","linear-search-unsorted-array"],genDifficulty:"Medium",planned:["Second Largest Element","Check if Array is Sorted","Left Rotate by One","Missing Number","Merge Intervals","Next Permutation"]},
      {slug:"hashing",title:"Hashing",blurb:"Trade space for time with maps and sets.",seedIds:["two-sum","majority-element","count-subarrays-with-sum-k","subarray-sum-equals-k","longest-consecutive-sequence","longest-subarray-given-sum","intersection-of-two-arrays"],genDifficulty:"Easy",planned:["Two Sum","Group Anagrams","Longest Consecutive Sequence","Subarray Sum Equals K"]},
      {slug:"binary-search",title:"Binary Search",blurb:"Sorted data means logarithmic answers.",seedIds:["find-target-index-in-sorted-array"],genDifficulty:"Easy",planned:["Binary Search","First and Last Occurrence","Search in Rotated Array","Find Minimum in Rotated Array","Single Element in Sorted Array"]},
      {slug:"strings-basic",title:"Strings (Basic)",blurb:"The everyday string toolkit.",seedIds:["reverse-string","valid-parentheses"],genDifficulty:"Easy",planned:["Reverse String","Valid Anagram","Longest Common Prefix","Reverse Words","Valid Parentheses"]},
      {slug:"recursion",title:"Recursion",blurb:"Think in base case + smaller problem.",seedIds:[],genDifficulty:"Easy",planned:["Pow(x,n)","Subsets","Combination Sum","Generate Parentheses","Permutations"]},
      {slug:"linked-list",title:"Linked List",blurb:"Pointer juggling, simulated with arrays here.",seedIds:[],genDifficulty:"Easy",planned:["Reverse Linked List","Middle of Linked List","Detect Cycle","Merge Two Sorted Lists"]},
      {slug:"bit-manipulation",title:"Bit Manipulation",blurb:"XOR tricks and bit surgery.",seedIds:["single-number","find-missing-number"],genDifficulty:"Easy",planned:["Single Number","Count Set Bits","Power of Two","Single Number II"]},
      {slug:"greedy",title:"Greedy",blurb:"Locally optimal choices that stay globally optimal.",seedIds:["best-time-to-buy-and-sell-stock","container-with-most-water"],genDifficulty:"Easy",planned:["Assign Cookies","Jump Game","Gas Station","Best Time to Buy Stock"]},
      {slug:"sliding-window",title:"Sliding Window / Two Pointers",blurb:"Linear scans over contiguous ranges.",seedIds:["container-with-most-water"],genDifficulty:"Medium",planned:["Longest Substring Without Repeat","Longest Repeating Char Replacement","Minimum Window Substring","Max Consecutive Ones III"]},
      {slug:"stack-queue",title:"Stack / Queue",blurb:"LIFO and FIFO problem patterns.",seedIds:["valid-parentheses"],genDifficulty:"Easy",planned:["Valid Parentheses","Min Stack","Next Greater Element","Daily Temperatures","Implement Queue using Stacks"]},
      {slug:"binary-trees",title:"Binary Trees",blurb:"Traversals and tree recursion, array-represented.",seedIds:[],genDifficulty:"Medium",planned:["Max Depth","Inorder Traversal","Level Order Traversal","Same Tree","Diameter of Binary Tree"]},
      {slug:"bst",title:"Binary Search Trees",blurb:"Ordered trees, ordered answers.",seedIds:[],genDifficulty:"Medium",planned:["Search in BST","Validate BST","Kth Smallest Element","Lowest Common Ancestor"]},
      {slug:"heaps",title:"Heaps",blurb:"Top-K and streaming order statistics.",seedIds:[],genDifficulty:"Medium",planned:["Kth Largest Element","Top K Frequent Elements","Last Stone Weight"]},
      {slug:"graphs",title:"Graphs",blurb:"BFS/DFS over adjacency lists.",seedIds:[],genDifficulty:"Medium",planned:["Number of Islands","Course Schedule","Number of Provinces","Rotting Oranges"]},
      {slug:"dp",title:"Dynamic Programming",blurb:"Overlapping subproblems, memoized or tabulated.",seedIds:["maximum-subarray","maximum-product-subarray"],genDifficulty:"Medium",planned:["Climbing Stairs","House Robber","Longest Increasing Subsequence","Coin Change","Maximum Subarray"]},
      {slug:"trie",title:"Trie",blurb:"Prefix trees for string sets.",seedIds:[],genDifficulty:"Medium",planned:["Implement Trie","Longest Common Prefix","Design Add and Search Words"]},
      {slug:"strings-advanced",title:"Strings (Advanced)",blurb:"Pattern matching algorithms.",seedIds:[],genDifficulty:"Medium",planned:["Implement strStr","Repeated Substring Pattern","Longest Palindromic Substring"]},
      {slug:"maths",title:"Maths",blurb:"Number theory for interviews.",seedIds:["find-missing-number"],genDifficulty:"Easy",planned:["Count Primes","Pow(x,n)","Excel Column Number","Palindrome Number"]},
    ];

    function norm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
    function nameMatches(q, name){
      const n=norm(name), t=norm(q.title);
      if(!n || !t) return false;
      return n===t || (n.length>=6 && (t.includes(n) || n.includes(t)));
    }

    let questions=[], statsMap={}, solvedSet=new Set(), attemptedSet=new Set(), aiReady=false;

    function stepQuestions(step){
      const tag="roadmap:"+step.slug;
      const seen=new Set();
      const matched=questions.filter(q=>{
        if(seen.has(q.id)) return false;
        const hit=(q.tags||[]).includes(tag)||step.seedIds.includes(q.id)||(step.planned||[]).some(n=>nameMatches(q,n));
        if(hit) seen.add(q.id);
        return hit;
      });
      const missing=(step.planned||[]).filter(n=>!matched.some(q=>nameMatches(q,n)));
      return {matched, missing};
    }

    async function loadAll(){
      const [qs, models, st] = await Promise.all([
        fetch("/api/questions").then(r=>{ if(!r.ok) throw new Error("questions failed"); return r.json(); }),
        fetch("/api/generate/models").then(r=>r.ok?r.json():null).catch(()=>null),
        fetch("/api/questions/stats").then(r=>{ if(!r.ok) return []; return r.json(); }).catch(()=>[]),
      ]);
      questions = qs;
      statsMap = {};
      (st||[]).forEach(s=>{ statsMap[s.questionId]={attempted:s.attempted||0, submissions:s.submissions||0, solved:s.solved||0}; });
      aiReady = !!(models && models.keyConfigured);
      if(!aiReady){
        const n=$("#ai-note");
        n.classList.remove("hidden");
        n.textContent="AI generation is not configured on this server (GROQ_API_KEY missing) — Generate buttons are disabled.";
      }
      if(getToken()){
        try{
          const r1=await fetch("/api/questions/solved",{headers:authHeaders({})});
          if(r1.ok){ (await r1.json()).forEach(id=>solvedSet.add(id)); }
          const r2=await fetch("/api/manual-solved",{headers:authHeaders({})});
          if(r2.ok){ (await r2.json()).forEach(id=>solvedSet.add(id)); }
          const r3=await fetch("/api/submissions?limit=100",{headers:authHeaders({})});
          if(r3.ok){ (await r3.json()).forEach(s=>{ if(!solvedSet.has(s.questionId)) attemptedSet.add(s.questionId); }); }
        }catch{}
      }
    }

    function qRow(q){
      const st=solvedSet.has(q.id)?"solved":(attemptedSet.has(q.id)?"attempted":"todo");
      const mark=st==="solved"?'<span class="rm-mark" title="Solved">✓</span>':(st==="attempted"?'<span class="rm-mark" title="Attempted">●</span>':'<span class="rm-mark" title="Todo">·</span>');
      const ai=(q.tags||[]).includes("AI")?'<span class="rm-ai" title="AI generated">AI</span>':"";
      const topics=(q.tags||[]).filter(t=>t!=="AI"&&!t.startsWith("roadmap:"));
      const s=statsMap[q.id]||{attempted:0,submissions:0,solved:0};
      const rate=s.attempted?Math.round(s.solved/s.attempted*100)+"%":"–";
      return `<div class="rm-row ${st}">
        ${mark}<a href="index.html#${esc(q.id)}" class="rm-qtitle">${esc(q.title)}</a>${ai}
        <span class="badge ${esc(q.difficulty)}" style="font-size:11px">${esc(q.difficulty)}</span>
        <span class="rm-topics">${topics.map(esc).join(" · ")||"general"}</span>
        <span class="rm-stats" title="${s.submissions} total tries">${s.attempted} attempted · ${s.solved} solved · ${rate}</span>
      </div>`;
    }

    const rmCollapsed=new Set();
    function render(){
      const allIds=new Set();
      const perStep=STEPS.map(s=>({step:s, ...stepQuestions(s)}));
      perStep.forEach(({matched})=>matched.forEach(q=>allIds.add(q.id)));
      const allMatched=[...allIds].map(id=>questions.find(q=>q.id===id)).filter(Boolean);
      const solved=[...allIds].filter(id=>solvedSet.has(id)).length;
      const pctAll=allIds.size?Math.round(solved/allIds.size*100):0;
      const byDiff={Easy:{s:0,t:0},Medium:{s:0,t:0},Hard:{s:0,t:0}};
      for(const q of allMatched){
        const d=byDiff[q.difficulty];
        if(!d) continue;
        d.t++;
        if(solvedSet.has(q.id)) d.s++;
      }
      $("#overall").innerHTML=`<div class="rm-hero">
        <div class="rm-hero-num"><strong>${solved} / ${allIds.size}</strong><span>roadmap questions solved${getToken()?"":" — <a href='login.html' class='ghost-link'>login</a> to track progress"}</span></div>
        <div class="diff-bar rm-hero-bar"><span style="width:${pctAll}%"></span></div>
        <div class="rm-chips">${["Easy","Medium","Hard"].map(d=>`<span class="rm-chip">${d} ${byDiff[d].s}/${byDiff[d].t}</span>`).join("")}</div>
      </div>`;
      $("#steps").innerHTML=perStep.map(({step:s, matched:qs, missing},i)=>{
        const done=qs.filter(q=>solvedSet.has(q.id)).length;
        const pct=qs.length?Math.round(done/qs.length*100):0;
        const status=pct>=100?"done":(done>0?"active":"todo");
        const barCls=pct>=100?"easy":(done>0?"medium":"");
        const icon=status==="done"?"✓":(status==="active"?"◐":"○");
        if(status==="done") rmCollapsed.add(s.slug);
        const collapsed=rmCollapsed.has(s.slug);
        const list=qs.length?qs.map(qRow).join(""):'<div class="rm-empty">Nothing here yet.</div>';
        const missingRows=missing.length?missing.map(n=>`
          <div class="rm-missing">
            <span class="rm-name">○ ${esc(n)}</span>
            <span class="badge ${esc(s.genDifficulty)}" style="font-size:11px">${esc(s.genDifficulty)}</span>
            <span class="rm-plan">planned · ${esc(s.title)} · missing</span>
            <button class="btn ghost gen-one" data-topic="${esc(n)}" data-diff="${esc(s.genDifficulty)}" data-tag="roadmap:${esc(s.slug)}" style="padding:4px 10px;font-size:12px" ${aiReady?"":"disabled title='AI not configured'"}>✨ Generate</button>
          </div>`).join(""):'<div class="rm-complete">All planned questions present ✓</div>';
        return `<div class="rm-step ${status}${collapsed?" collapsed":""}">
          <button class="rm-head" data-slug="${esc(s.slug)}">
            <span class="rm-status">${icon}</span>
            <span class="rm-stepnum">Step ${i+1}</span>
            <span class="rm-title">${esc(s.title)}</span>
            <span class="rm-meta">${done}/${qs.length} solved · ${missing.length} missing</span>
            <span class="rm-chev">▾</span>
          </button>
          <div class="rm-step-body">
            <div class="rm-blurb">${esc(s.blurb)}</div>
            <div class="diff-bar ${barCls}"><span style="width:${pct}%"></span></div>
            <div>${list}</div>
            <div style="margin-top:8px">${missingRows}</div>
          </div>
        </div>`;
      }).join("");
      document.querySelectorAll(".rm-head").forEach(b=>b.addEventListener("click",()=>{
        const slug=b.dataset.slug;
        const card=b.closest(".rm-step");
        if(!card) return;
        card.classList.toggle("collapsed");
        if(card.classList.contains("collapsed")) rmCollapsed.add(slug);
        else rmCollapsed.delete(slug);
      }));
      document.querySelectorAll(".gen-one").forEach(b=>b.addEventListener("click",(ev)=>{ ev.stopPropagation(); generateOne(b); }));
    }

    async function generateOne(btn){
      const topic=btn.dataset.topic, difficulty=btn.dataset.diff||"Easy", tag=btn.dataset.tag;
      if(!getToken()){ toast("Login first to generate questions."); location.href="login.html"; return; }
      btn.disabled=true;
      const orig=btn.textContent;
      btn.textContent="Generating… (up to ~2 min)";
      try{
        const r=await fetch("/api/questions/generate",{method:"POST",headers:authHeaders({"Content-Type":"application/json"}),body:JSON.stringify({topic,difficulty,tags:[tag]})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(d.error||("generate failed ("+r.status+")"));
        toast(`Added: ${d.title}${d.attempts>1?` (took ${d.attempts} tries)`:""}`);
        const qs=await fetch("/api/questions").then(x=>x.json());
        questions=qs;
        render();
      }catch(e){
        toast("Generate failed: "+e.message);
        btn.disabled=aiReady?false:true;
      }finally{
        if(btn.isConnected && btn.textContent.startsWith("Generating")){ btn.textContent=orig; }
      }
    }

    (async()=>{
      updateTopbar();
      const t=getToken();
      if(t){
        try{ const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+t}}); if(!r.ok) clearAuth(); else { const u=await r.json(); localStorage.setItem("user",JSON.stringify(u)); updateTopbar(); } }catch{}
      }
      try{ await loadAll(); render(); }
      catch(e){ $("#overall").textContent="Error: "+e.message; }
    })();
  </script>
</body>
</html>
